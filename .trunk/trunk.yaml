version: 0.1
runtimes:
  enabled:
    - go@1.19.5
    - node@18.12.1
plugins:
  sources:
    - id: trunk
      ref: v0.0.16
      uri: https://github.com/trunk-io/plugins
cli:
  version: 1.8.1
lint:
  disabled:
    - gitleaks
  enabled:
    - git-diff-check@SYSTEM
    - markdownlint@0.33.0
    - prettier@2.8.8
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
