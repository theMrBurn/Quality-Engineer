version: 0.1
runtimes:
  enabled:
    - python@3.10.8
    - go@1.19.5
    - node@18.12.1
plugins:
  sources:
    - id: trunk
      ref: v1.0.0
      uri: https://github.com/trunk-io/plugins
cli:
  version: 1.13.0
lint:
  disabled:
    - gitleaks
  enabled:
    - yamllint@1.32.0
    - git-diff-check@SYSTEM
    - markdownlint@0.35.0
    - prettier@3.0.2
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
