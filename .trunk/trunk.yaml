version: 0.1
runtimes:
  enabled:
    - go@1.18.3
    - node@16.14.2
plugins:
  sources:
    - id: trunk
      ref: v0.0.8
      uri: https://github.com/trunk-io/plugins
cli:
  version: 1.3.1
lint:
  disabled:
    - gitleaks
  enabled:
    - git-diff-check@SYSTEM
    - markdownlint@0.32.2
    - prettier@2.8.1
actions:
  enabled:
    - trunk-upgrade-available
