version: 0.1
runtimes:
  enabled:
    - go@1.18.3
    - node@16.14.2
plugins:
  sources:
    - id: trunk
      ref: v0.0.12
      uri: https://github.com/trunk-io/plugins
cli:
  version: 1.7.0
lint:
  disabled:
    - gitleaks
  enabled:
    - git-diff-check@SYSTEM
    - markdownlint@0.33.0
    - prettier@2.8.7
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
