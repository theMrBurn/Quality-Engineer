services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    ports:
      - 3330:3330
    environment:
      - NODE_ENV=development
    healthcheck:
      test: [CMD, curl, -f, http://localhost:3330/health]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - .:/workspace:cached
      - /workspace/node_modules
    working_dir: /workspace
    user: node
    command: [bash]  # Run bash as PID 1
    stdin_open: true  # Keep STDIN open (like `-i`)
    tty: true         # Allocate a pseudo-TTY (like `-t`)

  tests:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    depends_on:
      app:
        condition: service_healthy
    # Per-project baseURL env vars follow the BASEURL_<PROJECT_NAME> convention.
    # playwright.config.js reads these as the highest-priority override.
    # (none set by default — projects.json values are authoritative)
    # No PLAYWRIGHT_PROJECT set here for flexibility.
    volumes:
      - .:/workspace:cached
      - /workspace/node_modules
    working_dir: /workspace
    user: node
    command: [bash]  # Run bash as PID 1
    stdin_open: true  # Keep STDIN open
    tty: true         # Allocate a pseudo-TTY