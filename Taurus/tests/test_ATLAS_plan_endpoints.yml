---
variables:
  planID: 0
  sectionID: 2
  stepID: 2

execution:
  - concurrency: 75
    ramp-up: 1m
    hold-for: 5m
    scenario: validate_plan_endpoints
    cloud: true # Using Taurus Cloud for reporting

scenarios:
  validate_plan_endpoints:
    requests:
      - url: https://test.lpp.lithia.com/atlas/plan/24/section/2/step/2
        method: PATCH
        headers:
          Content-Type: application/json
        body:
          raw-body: |
            [{"sectionId":2,"stepId":2,"cardId":23,"value":"24000","dataSource":{"source":"OpsForecast","dataType":"number","sourceSelector":{"measure":"amt","scenario":"AOP"},"account":"LOPS50305"}}

reporting:
  - module: console
  - module: final-stats
    summary: true
    percentiles: true
    failed-labels: false
    test-duration: true
    dump-csv: ./Taurus/ATLAS/TaurusResult/perf_result_csv.csv
  - module: junit-xml
    data-source: pass-fail
    filename: ./Taurus/ATLAS/TaurusResult/junit-result.xml
  - module: cloud # Using Taurus Cloud for reporting
