config:
  target: https://test.lpp.lithia.com/atlas
  phases:
    - duration: 1200 # First 3 minutes
      arrivalRate: 4 # Ramping up to 4 virtual users per second
    - duration: 120 # Last 2 minutes
      arrivalRate: 12 # Maintaining 12 virtual users per second
  config: ./config/artillery-config.yml

variables:
  planID: "1" # Define your variable and its initial value.

scenarios:
  - flow:
      - get:
          url: /config/plan/${__urlencode(${planID})}/navigation

processors:
  - engine: playwright

modules:
  console:
    logging: true

  final-stats: {}

  junit:
    filename: artillery-junit.xml

  blazemeter:
    reportName: Artillery test report
    reportTest: Artillery test
    reportProject: Artillery test project
